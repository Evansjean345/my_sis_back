# =============================================================================
#  SISBM CORE — pile complète
#
#  ⚠ LANCER DEPUIS LA RACINE DU PROJET, avec --env-file :
#
#      docker compose --env-file .env -f docker/docker-compose.yml up -d postgres redis
#
#  Compose déduit son « répertoire de projet » du dossier contenant ce fichier
#  (donc docker/) et y cherche un .env. Sans --env-file, le .env de la racine
#  n'est jamais lu et l'interpolation échoue.
#
#  Plus simple : utiliser les scripts npm — npm run docker:up
# =============================================================================

# Réglages communs aux processus de fond (ingestion, outbox, planification).
# Ils tournent sur la MÊME image que l'API, construite une seule fois.
x-background-process: &background-process
  image: sisbm-app:latest
  pull_policy: never # image locale, construite par le service api
  restart: unless-stopped
  env_file: ../.env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    RUN_MIGRATIONS: 'false'
  # La sonde HTTP du Dockerfile (/health sur 3333) ne concerne que l'API :
  # un worker n'écoute aucun port et serait déclaré « unhealthy ».
  healthcheck:
    disable: true
  # Laisse le temps à l'arrêt gracieux (fin du passage en cours, pool PostgreSQL).
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sisbm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sisbm_core}
      POSTGRES_USER: ${DB_USER:-sisbm_owner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD introuvable. Lance depuis la racine avec --env-file .env (ou npm run docker:up)}
      POSTGRES_INITDB_ARGS: '--data-checksums --locale=C --encoding=UTF8'
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - enable_partitionwise_join=on
      - -c
      - enable_partitionwise_aggregate=on
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
      - -c
      - track_io_timing=on
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-sisbm_owner} -d ${DB_DATABASE:-sisbm_core}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sisbm_redis
    restart: unless-stopped
    # noeviction : Redis porte les files BullMQ. Évincer une clé sous pression
    # mémoire ferait disparaître des notifications et des commandes en attente.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: sisbm-app:latest # partagée avec ingest, outbox et schedules
    container_name: sisbm_api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RUN_MIGRATIONS: '${RUN_MIGRATIONS:-false}'
    ports:
      - '${PORT:-3333}:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------ processus de fond
  # PROCESSUS SÉPARÉS de l'API : une rafale de Store & Forward ou un pic de
  # notifications ne doit pas dégrader le temps de réponse des tableaux de bord.

  # Ingestion télémétrie : consomme le broker MQTT flespi (mqtt.flespi.io),
  # PAS le mosquitto local. Une seule instance par défaut.
  ingest:
    <<: *background-process
    container_name: sisbm_ingest
    command: ['node', 'ace', 'sisbm:ingest']

  # Outbox : remet les événements validés à leurs handlers (SMS Twilio, e-mails…).
  # Plusieurs instances possibles (SKIP LOCKED).
  outbox:
    <<: *background-process
    container_name: sisbm_outbox
    command: ['node', 'ace', 'sisbm:outbox:dispatch', '--watch']

  # Immobilisation planifiée : un passage par minute. Une seule instance agit
  # à la fois (verrou Redis).
  schedules:
    <<: *background-process
    container_name: sisbm_schedules
    command: ['node', 'ace', 'sisbm:schedules:enforce', '--watch']

  # ---------------------------------------------------------------- broker MQTT
  # Image OFFICIELLE Docker. MQTT 5 requis pour le TTL par message.
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    container_name: sisbm_mqtt
    restart: unless-stopped
    ports:
      # Développement seulement. En production, n'exposer que 8883 (TLS).
      - '${MQTT_PORT:-1883}:1883'
    volumes:
      # `:ro` — le broker ne doit jamais réécrire sa propre configuration
      # ni son fichier de mots de passe.
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Chemins RÉELS du dépôt : les deux fichiers sont dans `mosquitto/config/`.
      # Montés depuis `./mosquitto/acl` (inexistant), Docker crée un RÉPERTOIRE
      # vide à la place et mosquitto refuse de démarrer — `allow_anonymous` est
      # à false et il ne trouve aucun fichier de mots de passe.
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # -E : se connecte puis quitte aussitôt. Vérifie que le broker RÉPOND,
      # pas seulement que le processus tourne.
      test:
        [
          'CMD-SHELL',
          "mosquitto_sub -h localhost -t '$$SYS/#' -E -i healthcheck -u sisbm_monitor -P $$MQTT_MONITOR_PASSWORD || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?mot de passe monitor requis}

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
